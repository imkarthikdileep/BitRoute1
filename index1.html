<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Drop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f0f0f0;
            margin: 0;
        }
        #container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button, input[type="file"] {
            padding: 10px;
            margin: 5px;
            width: 100%;
            box-sizing: border-box;
        }
        #signalBox {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            box-sizing: border-box;
        }
        #status, #instructions {
            margin: 10px 0;
            color: #555;
        }
        #progress {
            width: 100%;
            height: 20px;
        }
        #downloadLink {
            display: none;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }
        @media (max-width: 480px) {
            #container {
                padding: 10px;
            }
            button, input[type="file"] {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>P2P File Drop</h1>
        <input type="file" id="fileInput">
        <br>
        <button onclick="startConnection()">Connect to Peer</button>
        <br>
        <textarea id="signalBox" placeholder="Enter peer ID here"></textarea>
        <div id="status">Waiting for peer ID...</div>
        <progress id="progress" value="0" max="100"></progress>
        <a id="downloadLink">Download File</a>
        <div id="instructions">
            1. Wait for your Peer ID to appear.<br>
            2. Share your Peer ID with your peer.<br>
            3. Enter their Peer ID and click "Connect to Peer".<br>
            4. Select a file to send or receive!
        </div>
    </div>
    <script src="app1.js"></script>
</body>
</html>
